repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: local
    hooks:
      # The integration tests are checked here because nothing else reads them: they are skipped
      # unless provider credentials are present, so a signature change breaks them silently until
      # someone runs them against a real provider.
      - id: ty-check
        name: ty
        entry: uvx ty check src/apron_auth tests/integration --python .venv
        language: system
        pass_filenames: false
        types: [python]
        files: ^(src/|tests/integration/)

      # The typing fixtures assert that a wrong call stays a type error, which they state as a
      # suppression. An unused suppression has to fail, so this check promotes every warning.
      - id: ty-check-typing-fixtures
        name: ty (typing fixtures)
        entry: uvx ty check tests/typing --python .venv --error-on-warning
        language: system
        pass_filenames: false
        types: [python]
        files: ^(src/|tests/typing/)

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.7
    hooks:
      - id: uv-lock
